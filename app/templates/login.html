<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — FleetSense</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("fleetsense-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) { }
    })();
  </script>
</head>

<body>

  <header class="masthead">
    <div class="masthead-inner">
      <div class="wordmark">Fleet<span>Sense</span></div>
      <div class="masthead-sub">Motor current signature analysis</div>
    </div>
  </header>

  <main class="auth-shell">
    <section class="panel">
      <div class="panel-head">Sign in</div>
      <div class="panel-body">

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for m in messages %}<div class="form-error">{{ m }}</div>{% endfor %}
        {% endif %}
        {% endwith %}

        <form method="post">
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="field-label" for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <button class="btn" type="submit">Sign in</button>
          </div>
        </form>

        <p class="auth-alt">No account yet? <a href="{{ url_for('register') }}">Register your site</a></p>
      </div>
    </section>
  </main>

</body>

</html>
