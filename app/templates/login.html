{% extends "base.html" %}
{% block title %}Sign in — FleetSense{% endblock %}

{% block content %}
<main class="auth-shell">
    <section class="panel">
      <div class="panel-head">Sign in</div>
      <div class="panel-body">

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for m in messages %}<div class="form-error">{{ m }}</div>{% endfor %}
        {% endif %}
        {% endwith %}

        <form method="post">
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label class="field-label" for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <button class="btn" type="submit">Sign in</button>
          </div>
        </form>

        <p class="auth-alt">No account yet? <a href="{{ url_for('register') }}">Register your site</a></p>
      </div>
    </section>
  </main>
{% endblock %}
